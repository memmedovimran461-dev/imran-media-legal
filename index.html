<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İmran Media — Hüquqi sənədlər</title>
<style>
  :root{color-scheme:light dark;--bg:#ffffff;--fg:#1a1a1a;--muted:#666;--card:#f6f7f9;--border:#e3e5e8;--accent:#2563eb}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#e8eaed;--muted:#9aa0a6;--card:#171a21;--border:#2a2e37;--accent:#5b8def}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:16px}
  .wrap{max-width:720px;margin:0 auto;padding:24px 0}
  h1{font-size:1.7rem;margin:.2em 0}
  p.lead{color:var(--muted);margin-top:0}
  .grid{display:grid;gap:14px;margin-top:28px}
  a.card{display:block;padding:18px 20px;background:var(--card);border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--fg)}
  a.card:hover{border-color:var(--accent)}
  a.card b{display:block;font-size:1.1rem;color:var(--accent)}
  a.card span{color:var(--muted);font-size:.95rem}
  footer{margin-top:40px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>İmran Media</h1>
  <p class="lead">Avtomatik xəbər-paylaşım xidmətinin hüquqi sənədləri.</p>
  <div class="grid">
    <a class="card" href="privacy.html"><b>Məxfilik Siyasəti</b><span>Hansı məlumatları toplayırıq və necə qoruyuruq.</span></a>
    <a class="card" href="terms.html"><b>İstifadə Şərtləri</b><span>Xidmətdən istifadə qaydaları.</span></a>
    <a class="card" href="data-deletion.html"><b>Məlumatların Silinməsi</b><span>Məlumatlarınızın silinməsini necə tələb edə bilərsiniz.</span></a>
  </div>
  <footer>Əlaqə: <a href="mailto:memmedovimran461@gmail.com">memmedovimran461@gmail.com</a></footer>
</div>
</body>
</html>
